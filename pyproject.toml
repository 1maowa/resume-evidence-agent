[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-evidence-agent"
version = "0.3.0"
description = "A resume-to-job evidence matching agent with MCP tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
  "mcp>=1.9,<2",
  "fastapi>=0.115,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "uvicorn>=0.30,<1",
]

[project.scripts]
resume-match = "career_match_agent.cli:main"
resume-match-mcp = "career_match_agent.mcp_server:main"
resume-match-web = "career_match_agent.web_app:main"

[tool.setuptools.packages.find]
include = ["career_match_agent*"]

